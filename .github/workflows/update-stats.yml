name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# 【新增这一段】明确赋予机器人写入仓库代码的权
permissions:
  contents: write

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22 # 【修改点1】将 Node 版本从 18 升级到 22

      - name: Clone github-readme-stats
        run: git clone https://github.com/anuraghazra/github-readme-stats.git /tmp/stats

      - name: Build, Start Server and Generate SVGs
        env:
          PAT_1: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          cd /tmp/stats
          npm ci
          
          # 【修改点2】不再使用 npm run start，而是直接运行它自带的本地 Express 服务
          node express.js &
          
          echo "等待服务启动..."
          sleep 15
          
          cd ${{ github.workspace }}
          mkdir -p assets
          
          curl -f -o assets/github-stats.svg "http://localhost:9000/api?username=Plumess&show_icons=true&count_private=true&theme=transparent&hide_border=true"
          curl -f -o assets/top-langs.svg "http://localhost:9000/api/top-langs/?username=Plumess&langs_count=8&layout=compact&count_private=true&theme=transparent&hide_border=true"
          curl -f -o assets/wakatime.svg "http://localhost:9000/api/wakatime?username=Plume&langs_count=8&layout=compact&theme=dark"

      - name: Commit and Push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/
          git commit -m "chore: auto-update github stats svgs" || exit 0
          git push
